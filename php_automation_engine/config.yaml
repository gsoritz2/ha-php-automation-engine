name: "PHP Automation Engine"
version: "0.2.1"
slug: "php_automation_engine"
description: "Fuehrt PHP-Automationen (Edomi-LBS-Stil) aus und verbindet sie mit Home Assistant"
url: "https://github.com/gsoritz2/ha-php-automation-engine/tree/main/php_automation_engine"
arch:
  - aarch64
  - amd64
init: true
startup: application
boot: auto
stage: stable
timeout: 30
homeassistant_api: true
hassio_api: false
host_network: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:language-php"
panel_title: "PHP Automation"
watchdog: "http://[HOST]:[PORT:8099]/health"
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Status-/Webhook-API (nur aktivieren, wenn HA sie per rest_command aufrufen soll)"
map:
  - type: share
    read_only: false
options:
  script_dir: "/share/php_automations"
  poll_interval: 2.0
  log_level: "info"
  log_lines: 500
  timezone: "Europe/Vienna"
  ko_map: "ko_map.json"
  auto_reload: true
schema:
  script_dir: "str"
  poll_interval: "float(0.2,60)"
  log_level: "list(trace|debug|info|warning|error)"
  log_lines: "int(50,5000)"
  timezone: "str"
  ko_map: "str"
  auto_reload: "bool"
